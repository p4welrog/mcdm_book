[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdm-book"
version = "0.1.0"
description = "Metody wielokryterialnego wspomagania decyzji z książki pod red. T. Trzaskalika (PWE 2014): interfejs JSON"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
mcf = ["xlrd>=2"]

[tool.setuptools]
packages = ["mcdm_book", "mcdm_cd"]

[tool.setuptools.package-data]
mcdm_cd = ["data/*.mcf", "data/*.json"]
